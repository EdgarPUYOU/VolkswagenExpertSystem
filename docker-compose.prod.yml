# Production on a small VPS: Caddy (HTTPS) in front of one app container.
# Only Caddy publishes ports. Copy .env.example to .env and fill it in first.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://ai.sumopod.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
    expose:
      - "8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/vw-erp", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
